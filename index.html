<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG cho trình duyệt hiện đại (nét ở mọi kích thước), .ico cho bản cũ
         và cho lần trình duyệt tự hỏi /favicon.ico. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- iOS không đọc được SVG khi thêm vào màn hình chính, phải có PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#15803d" />

    <!-- Baloo 2 cho tiêu đề (tròn, vui) + Be Vietnam Pro cho chữ thường (thiết
         kế riêng cho dấu tiếng Việt, đọc lâu không mỏi). Cả hai có bộ ký tự
         vietnamese — Comic Neue mà bộ gợi ý đề xuất thì không, dấu sẽ rơi sang
         font khác giữa chữ. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese"
    />
    <meta name="description" content="EnglishEx — học tiếng Anh qua từ vựng lặp lại ngắt quãng, bài đọc và tủ sách kinh điển." />

    <title>EnglishEx — Học tiếng Anh</title>

    <!-- Gắn theme đã lưu TRƯỚC khi trang vẽ. Xanh là mặc định; người dùng đã
         chọn tím vẫn giữ lựa chọn. Trùng khoá và giá trị với src/lib/theme.js. -->
    <script>
      try {
        if (localStorage.getItem('englishex_theme') !== 'purple') {
          document.documentElement.dataset.theme = 'green'
        } else {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#7c3aed')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
